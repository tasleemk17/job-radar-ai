server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API lives behind the same address, so the browser needs no CORS and no API URL baked in
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;   # lets the cover letter stream word by word
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;   # React Router: every page is index.html
  }
}
